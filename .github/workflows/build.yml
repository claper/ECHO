name: Build & Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write  # ← necessari per pujar a ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Login a ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build i push
        run: |
          docker build -t ghcr.io/claper/echo:latest .
          docker push ghcr.io/claper/echo:latest
